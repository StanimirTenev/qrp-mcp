[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "qrp-mcp-core"
version = "0.2.0"
description = "Optional compiled line gate for qrp-mcp (release D). qrp-mcp uses it when installed and reads the same lines without it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Stanimir Tenev" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Repository = "https://github.com/StanimirTenev/qrp-mcp"

[tool.maturin]
module-name = "qrp_mcp_core"
features = ["pyo3/extension-module"]
