# The lock of the server the plugin launches (`uvx qrp-mcp==X` in .mcp.json): uv.lock names
# its versions, registry sources and hashes for the directory to verify. uvx itself does
# not read this lock; it resolves the dependencies from PyPI when it installs.
[project]
name = "qrp-plugin"
version = "0.38.0"
requires-python = ">=3.10"
dependencies = ["qrp-mcp==0.38.0"]

[tool.uv]
package = false
# Only the platforms qrp-mcp-core ships wheels for: keeps the lock well under the
# directory's 256 KiB per-file limit (all platforms: ~279 KiB).
environments = [
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "sys_platform == 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'arm64')",
    "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64')",
]
