options {
    edns-udp-size 1232;
    max-udp-size 1232;
};
dnssec-policy "pq-test" {
    keys {
        ksk lifetime unlimited algorithm ecdsap256sha256;
        zsk lifetime 30d algorithm rsasha256 2048;
    };
};
zone "example.com" { type primary; file "example.com.zone"; dnssec-policy "pq-test"; };
