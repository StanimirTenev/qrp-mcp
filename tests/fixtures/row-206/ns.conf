add ssl profile prof_fe_pq -sslProfileType FrontEnd -tls1 DISABLED -tls11 DISABLED -tls12 ENABLED -tls13 ENABLED
bind ssl profile prof_fe_pq -eccCurveName X25519_MLKEM768
bind ssl profile prof_fe_pq -eccCurveName P_256
bind ssl profile prof_fe_pq -cipherName TLS1.3-AES256-GCM-SHA384
bind ssl profile prof_fe_pq -cipherName TLS1.2-ECDHE-RSA-AES256-GCM-SHA384
add ssl profile prof_be -sslProfileType BackEnd -tls12 ENABLED -tls13 DISABLED
bind ssl profile prof_be -cipherName TLS1.2-AES256-GCM-SHA384
add ssl certKey bank_rsa -cert bank.crt -key bank.key
set ssl vserver vs_bank -sslProfileName prof_fe_pq
set ssl service svc_core -sslProfileName prof_be
