[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qrp-mcp"
version = "0.37.0"
description = "A local cryptographic inventory for developers and AI agents that carries verifiable coverage and its own limits inside the CBOM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Stanimir Tenev" }]
keywords = [
    "mcp", "post-quantum", "pqc", "cryptography", "security", "crypto-inventory",
    "blockchain", "ethereum", "bitcoin", "solidity", "web3", "secp256k1", "quantum",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
]
# mcp 2.0 moved the server class to mcp.server.mcpserver; 1.x resolves to a missing module.
# cryptography parses certificates and keys (release C, ZA-OPRAVYANE row 127): declared,
# not borrowed from mcp's tree. 43.0 for Certificate.public_key_algorithm_oid.
dependencies = ["mcp>=2.0.0", "pydantic>=2.0", 'tomli; python_version < "3.11"',
                "cryptography>=43.0"]

[project.urls]
Homepage = "https://quantumreadiness.eu"
Repository = "https://github.com/StanimirTenev/qrp-mcp"

[project.scripts]
qrp-mcp = "qrp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qrp_mcp"]

# The commit a build is made from, as qrp_mcp/_build_info.py (hatch_build.py).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
# jsonschema is a test dependency only. The emitted CBOM is validated against the
# vendored CycloneDX schema in tests; the scanner itself hand-builds the document so
# `uvx qrp-mcp` stays a small offline install.
dev = ["pytest>=8.0", "fastapi>=0.110", "jsonschema>=4.20"]
