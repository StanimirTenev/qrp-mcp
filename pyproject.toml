[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qrp-mcp"
version = "0.1.0"
description = "Local, deterministic MCP server that finds quantum-vulnerable cryptography in your codebase"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Stanimir Tenev" }]
keywords = ["mcp", "post-quantum", "pqc", "cryptography", "security", "crypto-inventory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
]
# mcp 2.0 moved the server class to mcp.server.mcpserver; 1.x resolves to a missing module.
dependencies = ["mcp>=2.0.0", "pydantic>=2.0"]

[project.urls]
Homepage = "https://quantumreadiness.eu"
Repository = "https://github.com/StanimirTenev/qrp-mcp"

[project.scripts]
qrp-mcp = "qrp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qrp_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "fastapi>=0.110"]
