# Wheels for qrp-mcp-core (core/), the optional compiled line gate of qrp-mcp (release D).
#
# Prepared, not run: it starts only by hand (Actions -> core-wheels -> Run workflow), and it
# publishes only when that run is given `publish: true`, through PyPI trusted publishing
# from the `pypi` environment. Until then it builds and tests, and the wheels are artifacts.
#
# abi3 (pyo3 feature abi3-py310): one wheel per platform serves CPython 3.10 and later.
name: core-wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the wheels and the sdist to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-13, target: x86_64 }
          - { os: macos-14, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --manifest-path core/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path core/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # The wheel a runner can load, against qrp-mcp from this checkout: the gate gives the
  # findings that reading every line gives, and the whole suite passes with the core in.
  test:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: wheel-ubuntu-latest-x86_64, python: "3.10" }
          - { os: ubuntu-latest, artifact: wheel-ubuntu-latest-x86_64, python: "3.13" }
          - { os: macos-14, artifact: wheel-macos-14-aarch64, python: "3.12" }
          - { os: windows-latest, artifact: wheel-windows-latest-x64, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The core first: qrp-mcp pins this version, which PyPI may not have yet.
          python -m pip install --no-index --find-links dist qrp-mcp-core
          python -m pip install -e . pytest fastapi jsonschema
      - name: The core is the one in use
        run: python -c "from qrp_mcp import detectors as d; assert d.LINE_GATE.compiled() is not None"
      - name: Tests with the core
        run: python -m pytest tests/ -q -p no:warnings
      - name: Tests without it
        env:
          QRP_MCP_CORE: "0"
        run: python -m pytest tests/test_linegate.py -q -p no:warnings

  publish:
    if: ${{ inputs.publish }}
    needs: [wheels, sdist, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
