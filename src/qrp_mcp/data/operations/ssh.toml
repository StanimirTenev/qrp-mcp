id = "ssh-keygen-t-ed25519-sk"
spelling = "ssh-keygen -t ed25519-sk"
source = "https://man.openbsd.org/ssh-keygen"
quote = "-t ecdsa | ecdsa-sk | ed25519 | ed25519-sk | mldsa44-ed25519 | rsa Specifies the type of key to create."
file = "make-keys.sh"
snippet = '''
#!/bin/sh
ssh-keygen -t ed25519-sk -f /etc/ssh/host_key -N ''
'''
