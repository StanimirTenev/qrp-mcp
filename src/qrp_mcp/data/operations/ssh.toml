# Operation `ssh`, ecosystem SSH (OpenSSH): the key exchange and signature algorithms an OpenSSH
# configuration, key list or key command names. Pages fetched 18.11.2026 from man.openbsd.org
# (OpenBSD-current): sshd_config(5), ssh_config(5), sshd(8), ssh-keygen(1).
# `expect`: a classical key exchange is an ssh_kex row (family, offered alone); a hybrid is its
# post-quantum row with parameter set and a row for its classical half, and no ssh_kex row; a
# list after '-' and a key after @revoked are not uses.

operation = "ssh"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "SSH"
scope = "sshd_config KexAlgorithms (all 15 supported names, +/-/^ prefixes), HostKeyAlgorithms (every name of the default, certificates included), PubkeyAcceptedAlgorithms, HostbasedAcceptedAlgorithms, CASignatureAlgorithms, HostKey default files; ssh_config KexAlgorithms, HostKeyAlgorithms, PubkeyAcceptedAlgorithms; authorized_keys key types and known_hosts @revoked/@cert-authority markers (sshd(8)); ssh-keygen -t and -b. Not covered: Ciphers/MACs (operation ciphers), RevokedKeys and KRL files, Match blocks, Include, GSSAPIKexAlgorithms, the size of a key inside authorized_keys (operation keysize), the pre-release ML-DSA name of row 18 (not on these pages), other SSH servers (Dropbear, libssh, Tectia)."

[[ecosystems.spellings]]
id = "kex-curve25519-sha256"
spelling = "KexAlgorithms curve25519-sha256"
source = "https://man.openbsd.org/sshd_config"
quote = "The supported algorithms are: curve25519-sha256 curve25519-sha256@libssh.org diffie-hellman-group1-sha1 diffie-hellman-group14-sha1 diffie-hellman-group14-sha256 diffie-hellman-group16-sha512 diffie-hellman-group18-sha512 diffie-hellman-group-exchange-sha1 diffie-hellman-group-exchange-sha256 ecdh-sha2-nistp256 ecdh-sha2-nistp384 ecdh-sha2-nistp521 mlkem768nistp256-sha256 mlkem768x25519-sha256 sntrup761x25519-sha512"
file = "sshd_config"
snippet = '''
KexAlgorithms curve25519-sha256
'''
expect = {rows = [{at = "evidence.ssh_kex", match = {path = "sshd_config", line = 1, group = "curve25519-sha256", family = "X25519", offered = "alone", setting = "KexAlgorithms"}}]}

