# Operation `pqc_standalone` (a part of pqc, named apart so that it does not read as pqc/Go closed),
# ecosystem Go (25.11.2026, row 555): ML-KEM in Go's standard library, and whether the
# line uses it alone or as a hybrid. crypto/mlkem's constructors and crypto/tls's CurveID values (pure
# MLKEM1024 beside the hybrids). Kept in a file of its own. Pages fetched 25.11.2026 (pkg.go.dev).
# `expect`: an ML-KEM row with its parameter set; `standalone_pqc` where the line uses ML-KEM with no
# classical half, and not on a hybrid.

operation = "pqc_standalone"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "Go"
scope = "crypto/mlkem GenerateKey768, GenerateKey1024, NewDecapsulationKey768/1024, NewEncapsulationKey768/1024; crypto/tls CurveID MLKEM1024 (standalone) and X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024 (hybrids). Said of the line: ML-KEM combined with a classical KEM by hand elsewhere is not read as a hybrid. Not covered: crypto/hpke KEM identifiers, golang.org/x/crypto, cloudflare/circl (its scheme registry is row 548)."

[[ecosystems.spellings]]
id = "go-mlkem-generatekey768"
spelling = "mlkem.GenerateKey768()"
source = "https://pkg.go.dev/crypto/mlkem"
quote = "func GenerateKey768() (*DecapsulationKey768, error)"
file = "kem.go"
snippet = '''
package main

import "crypto/mlkem"

func main() {
	dk, _ := mlkem.GenerateKey768()
	_ = dk.EncapsulationKey()
}
'''
expect = {rows = [{at = "evidence.source_code", match = {path = "kem.go", line = 6, algorithm = "ML-KEM", parameter_set = "768", standalone_pqc = true}}]}

