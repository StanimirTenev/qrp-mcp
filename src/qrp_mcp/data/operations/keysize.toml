[[ecosystems.refresh]]
source = "https://www.rfc-editor.org/rfc/rfc7468.txt"
pattern = '-----BEGIN ([A-Z0-9 ]+)-----'
ignore = ["X509 CRL", "ATTRIBUTE CERTIFICATE", "ENCRYPTED PRIVATE KEY"]
file = "candidate.pem"
snippet = "-----BEGIN {candidate}-----\nMIIBAA==\n-----END {candidate}-----\n"
expect = {rows = [{at = "evidence.source_code", match = {path = "candidate.pem", line = 1}}]}

[[ecosystems.refresh]]
source = "https://www.rfc-editor.org/rfc/rfc7518.txt"
pattern = '"crv":\s*"([A-Za-z0-9-]+)"'
file = "jwks.json"
snippet = "{\n  \"keys\": [\n    {\"kty\": \"EC\", \"crv\": \"{candidate}\", \"x\": \"AA\", \"y\": \"AA\"}\n  ]\n}\n"
expect = {rows = [{at = "evidence.source_code", match = {path = "jwks.json", line = 3}}]}

[[ecosystems.refresh]]
source = "https://www.rfc-editor.org/rfc/rfc8037.txt"
pattern = '"crv":\s*"([A-Za-z0-9-]+)"'
file = "jwks.json"
snippet = "{\n  \"keys\": [\n    {\"kty\": \"OKP\", \"crv\": \"{candidate}\", \"x\": \"AA\"}\n  ]\n}\n"
expect = {rows = [{at = "evidence.source_code", match = {path = "jwks.json", line = 3}}]}
