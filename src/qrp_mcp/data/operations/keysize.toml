# Operation `keysize`: the size of an asymmetric key where it is written. Two ecosystems.
# NET: the .NET constructors and factories that take a size or a curve, the KeySize property,
# CNG BCryptGenerateKeyPair, CryptoAPI CryptGenKey, PowerShell New-SelfSignedCertificate and the
# Schannel minimum key lengths, from learn.microsoft.com (fetched 18.11.2026).
# PKI: the size inside a certificate, key or request (RFC 7468 labels), an OpenSSH public key,
# a JWK (RFC 7518, RFC 8037) and the key requests of cfssl and Hyperledger Fabric CA.
# `expect` is a row on the line (or in the file) with the family and the size the page gives.

operation = "keysize"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "NET"
scope = "System.Security.Cryptography constructors and Create(int|ECCurve) of RSA, DSA, ECDsa, ECDiffieHellman and their Cng/CryptoServiceProvider/OpenSsl classes; ECCurve.NamedCurves; AsymmetricAlgorithm.KeySize set on the next line; BCryptGenerateKeyPair dwLength with the algorithm of the handle; CryptGenKey upper 16 bits; New-SelfSignedCertificate -KeyLength/-KeyAlgorithm, splatted and with backtick continuation; Schannel ClientMinKeyBitLength. Not covered: ImportParameters/ImportFromPem (the size comes from the key), CngKey.Create with CngKeyCreationParameters, ECCurve.CreateFromFriendlyName/CreateFromOid, certreq .inf files, Schannel ServerMinKeyBitLength (not on the fetched page)."

