[[ecosystems]]
ecosystem = "PKI"
scope = "Certificates, SPKI and PKCS#8 keys and CSRs in PEM and DER for RSA, DSA and NIST EC; OpenSSH ssh-rsa and ecdsa-sha2 public keys; JWK RSA n, EC crv, OKP crv; cfssl key and Fabric CA csr.keyrequest. Not covered: encrypted keys and PKCS#12 (the size is behind a password), XML RSAKeyValue, the small-private-scalar check of rows 32/51/154/155 (a property of the key, not a spelling), JWK x5c chains."

