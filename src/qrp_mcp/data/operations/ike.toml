# Operation `ike`: an IKE / IPsec / VPN proposal (definition in qrp-kachestvo/obratna-proba/operacii/definicii.md).
# Every spelling below is taken from the page in its `source`, fetched on 18.11.2026; `quote` is the
# text on that page that names it. `expect` is what the spelling means by that page, not what the
# scanner printed. tests/test_operation_closure.py writes each `snippet` to `file`, scans it, and
# checks `expect`.

operation = "ike"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "IPsec"
scope = "strongSwan swanctl.conf proposals (every key exchange keyword of the proposals page), authentication constraints and PPK; Libreswan ipsec.conf ike=/esp= groups, authby= and ppk=; WireGuard keys. Not covered: strongSwan ipsec.conf (legacy), vendor CLIs (FortiOS, Cisco, Junos: netdev), IKE fragmentation (no algorithm)."

[[ecosystems.spellings]]
id = "strongswan-modp768"
spelling = "modp768"
source = "https://docs.strongswan.org/docs/latest/config/proposals.html"
quote = "modp768 768 bits 1"
file = "swanctl.conf"
snippet = '''
connections {
  gw {
    version = 2
    proposals = aes256-sha256-modp768
  }
}
'''
expect = {rows = [{at = "evidence.source_code", match = {line = 4, algorithm = "DH", key_size = 768}}, {at = "evidence.ike_proposals", match = {group = "modp768", family = "DH"}}]}

