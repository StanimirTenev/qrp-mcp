# Operation `apiname`, ecosystems Go, JS, Py, Rust and CI (qrp-mcp 0.54.0, 25.11.2026): the calls of
# crypto-asset libraries -- wallets (go-ethereum, ethers, viem, eth_account, eth_keys, alloy, ethers-rs,
# tiny-secp256k1, bip32, rust-secp256k1, python-bitcoinlib, Solana, cosmjs, tss-lib), BLS (blst,
# py_ecc), pairing-based proofs and commitments (gnark, snarkjs, arkworks, c-kzg, noble bn254) --
# ZA-OPRAVYANE rows 561-593 (post-quantum ones in pqc_chains.toml, CometBFT signing in sign_chains.toml). Bounded: only
# these libraries, and in each only the names on the saved page in `source` (fetched 25.11.2026,
# qrp-kachestvo/roy-2026-11-25-kripto/docs). Written by roy-2026-11-25-kripto/katalog/
# gen_apiname_chains.py, which cuts every quote from the saved page and checks it is there verbatim.
# `expect`: the family on the line, read as a call (or the import/name it is), in a file that imports
# the library. Solidity and Vyper are not here: the catalogue has no ecosystem for them (tests in
# tests/test_rows_564_566_solidity.py, test_rows_562_563_pairing.py, test_row_567_vyper.py).

operation = "apiname"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "Go"
scope = "go-ethereum/crypto, gnark groth16 and gnark-crypto ecc.BN254, bnb-chain tss-lib ecdsa/keygen, blst's Go binding, herumi bls-eth-go-binary (Falcon is in pqc/Go, CometBFT signing in sign/Go). Not covered: other Go chain libraries, a call through a variable the package is not imported under."

