package main

import blst "github.com/supranational/blst/bindings/go"

type PublicKey = blst.P1Affine
type Signature = blst.P2Affine

func run(ikm, msg, dst []byte) bool {
	sk := blst.KeyGen(ikm)
	pk := new(PublicKey).From(sk)
	sig := new(Signature).Sign(sk, msg, dst)
