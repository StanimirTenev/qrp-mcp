# Operation `keyfile`, ecosystem PKI files: a key or certificate file loaded or parsed -- PEM labels
# (RFC 7468, OpenSSL's traditional labels, RFC 5915, OpenSSH, RFC 4716, OpenPGP armor), the same
# structures in DER and PKCS#12, and PEM carried inside JSON and YAML. `material` names key material the
# test makes when it runs (tests/test_operation_closure.py, _make_material); no key is committed. The
# material is a 2048-bit RSA key and certificate, a P-256 key and request, an Ed25519 key; `expect` is
# what that material is. Pages fetched 18.11.2026.

operation = "keyfile"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "PKI"
scope = "PEM labels CERTIFICATE, X509 CRL, CERTIFICATE REQUEST, NEW CERTIFICATE REQUEST, PKCS7, CMS, PRIVATE KEY, ENCRYPTED PRIVATE KEY, PUBLIC KEY, RSA PRIVATE KEY, RSA PUBLIC KEY, EC PRIVATE KEY, OPENSSH PRIVATE KEY; SSH2 PUBLIC KEY; PGP PUBLIC KEY BLOCK; DER certificate, PKCS#8 key and PKCS#7; PKCS#12; PEM in JSON and YAML. Not covered: JKS/JCEKS (Java), .ovpn inline blocks (IPsec), ATTRIBUTE CERTIFICATE, PGP private keys."

[[ecosystems.spellings]]
id = "pem-certificate"
spelling = "-----BEGIN CERTIFICATE-----"
source = "https://www.rfc-editor.org/rfc/rfc7468.txt"
quote = "Public-key certificates are encoded using the \"CERTIFICATE\" label."
file = "cert.pem"
material = "CERT_RSA2048_PEM"
expect = {rows = [{at = "evidence.source_code", match = {algorithm = "RSA", key_size = 2048, line = 1}}]}

[[ecosystems.spellings]]
id = "pem-x509-crl"
spelling = "-----BEGIN X509 CRL-----"
source = "https://www.rfc-editor.org/rfc/rfc7468.txt"
quote = "Certificate Revocation Lists (CRLs) are encoded using the \"X509 CRL\" label."
file = "ca.crl"
material = "CRL_RSA_PEM"
expect = {rows = [{at = "evidence.source_code", match = {algorithm = "RSA"}}]}

[[ecosystems.spellings]]
id = "pem-certificate-request"
spelling = "-----BEGIN CERTIFICATE REQUEST-----"
source = "https://www.rfc-editor.org/rfc/rfc7468.txt"
quote = "-----BEGIN CERTIFICATE REQUEST-----"
file = "req.csr"
material = "CSR_EC256_PEM"
expect = {rows = [{at = "evidence.source_code", match = {algorithm = "EC", key_size = 256, curve = "P-256"}}]}

[[ecosystems.spellings]]
id = "pem-new-certificate-request"
spelling = "-----BEGIN NEW CERTIFICATE REQUEST-----"
source = "https://www.rfc-editor.org/rfc/rfc7468.txt"
quote = "The label \"NEW CERTIFICATE REQUEST\" is also in wide use."
file = "req.csr"
material = "CSR_EC256_NEW_PEM"
expect = {rows = [{at = "evidence.source_code", match = {algorithm = "EC", key_size = 256, curve = "P-256"}}]}

[[ecosystems.spellings]]
id = "pem-pkcs7"
spelling = "-----BEGIN PKCS7-----"
source = "https://www.rfc-editor.org/rfc/rfc7468.txt"
