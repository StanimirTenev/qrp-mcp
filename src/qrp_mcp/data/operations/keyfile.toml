source = "https://www.rfc-editor.org/rfc/rfc9580.txt"
quote = "Used for armoring public keys."
file = "keys.asc"
material = "fixture:openpgp/release-keys.asc"
expect = {rows = [{at = "evidence.source_code", match = {algorithm = "RSA", key_size = 2048}}]}

[[ecosystems.spellings]]
id = "der-certificate"
spelling = "certificate, DER"
source = "https://raw.githubusercontent.com/openssl/openssl/openssl-3.0/doc/man1/openssl-x509.pod.in"
quote = "[B<-inform> B<DER>|B<PEM>]"
file = "cert.der"
material = "CERT_RSA2048_DER"
expect = {rows = [{at = "evidence.source_code", match = {algorithm = "RSA", key_size = 2048, line = 1}}]}

[[ecosystems.spellings]]
id = "der-private-key"
spelling = "private key, PKCS#8 DER"
source = "https://raw.githubusercontent.com/openssl/openssl/openssl-3.0/doc/man1/openssl-pkey.pod.in"
quote = "=item B<-inform> B<DER>|B<PEM>|B<P12>|B<ENGINE>"
file = "key.der"
material = "RSA2048_PKCS8_DER"
expect = {rows = [{at = "evidence.embedded_keys", match = {key_algorithm = "RSA", key_size = 2048}}]}

[[ecosystems.spellings]]
id = "der-pkcs7"
spelling = "PKCS#7, DER"
source = "https://www.rfc-editor.org/rfc/rfc7468.txt"
quote = "The encoded data MUST be a BER-encoded ASN.1 ContentInfo"
file = "chain.p7b"
material = "CERT_RSA2048_PKCS7_DER"
expect = {rows = [{at = "evidence.source_code", match = {algorithm = "RSA", key_size = 2048}}]}

[[ecosystems.spellings]]
id = "pkcs12"
spelling = "PKCS#12 (.p12)"
source = "https://raw.githubusercontent.com/openssl/openssl/openssl-3.0/doc/man1/openssl-pkcs12.pod.in"
quote = "openssl pkcs12 -in file.p12 -out file.pem"
file = "file.p12"
material = "RSA2048_PKCS12"
expect = {rows = [{at = "evidence.embedded_keys", match = {line = 1}}]}

[[ecosystems.spellings]]
id = "pem-in-json-string"
spelling = "PEM inside a JSON string (\\n escapes)"
source = "https://www.rfc-editor.org/rfc/rfc8259.txt"
quote = "%x6E / ; n line feed U+000A"
file = "profile.json"
snippet = '''
{"tls": {"ca": "{{CERT_RSA2048_PEM|json}}"}}
'''
expect = {rows = [{at = "evidence.source_code", match = {algorithm = "RSA", key_size = 2048}}]}

[[ecosystems.spellings]]
id = "pem-in-yaml-literal-block"
spelling = "PEM inside a YAML literal block scalar (key: |)"
source = "https://yaml.org/spec/1.2.2/"
quote = "8.1.2. Literal Style"
file = "secret.yaml"
snippet = '''
apiVersion: v1
kind: Secret
stringData:
  ca.crt: |
{{CERT_RSA2048_PEM|4}}'''
expect = {rows = [{at = "evidence.source_code", match = {algorithm = "RSA", key_size = 2048}}]}

[[ecosystems.refresh]]
source = "https://www.rfc-editor.org/rfc/rfc7468.txt"
pattern = '-----BEGIN ([A-Z0-9 ]+)-----'
file = "candidate.pem"
snippet = "-----BEGIN {candidate}-----\nMIIBAA==\n-----END {candidate}-----\n"
expect = {rows = [{at = "evidence.source_code", match = {path = "candidate.pem", line = 1}}]}
