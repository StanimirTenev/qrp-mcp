[[ecosystems]]
ecosystem = "Java"
scope = "JCA standard names (JDK 21 Standard Algorithm Names) of KeyPairGenerator, KeyFactory, KeyAgreement, AlgorithmParameterGenerator, Signature, Cipher, MessageDigest, Mac, KeyGenerator and SecretKeyFactory for the classical public-key families and the weak symmetric and hash ones; \"DH\" and rawDSA; Bouncy Castle provider names (docs/specifications.md); Bouncy Castle lightweight engines, signers, generators, agreements and digests of those families and FalconSigner (row 74); the JCA key interfaces and specs (row 86); sha256WithRSAEncryption (RFC 8017, row 138); each with a provider, in Kotlin and through a constant. Source none (not tested): the provider aliases SHA, SHA256/RSA, RAWRSA, DSAwithSHA1 (rows 68, 138: no fetched page lists them). Not covered: the SHA-2/SHA-3/AES/ChaCha names that are no finding, the PQC names of JDK 24+, GOST/DSTU/SM2/SM9, XML Signature URIs, JSSE names."

