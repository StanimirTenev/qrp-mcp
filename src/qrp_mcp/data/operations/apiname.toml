# Operation `apiname`, ecosystem C: a primitive named through a C library's API, constant or header
# (definicii.md, rule B3). Bounded: only the libraries the family's rows name (ZA-OPRAVYANE rows 65,
# 67, 72, 73, 120, 122, 123, 133, 135), and in each only the public-key names on the reference pages
# in `source`, fetched 18.11.2026. The rest of each API (hashes, ciphers, the many helpers) is not
# in this catalogue. `expect`: the family the page gives the name, on the line it is written.

operation = "apiname"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "C"
scope = "OpenSSL 3.0 EVP key types and legacy RSA/DSA/DH/EC_KEY/ECDSA calls; wolfCrypt RSA/ECC/DH/DSA/Ed25519/Curve25519; libsodium crypto_sign/box/kx/scalarmult; Mbed TLS 3.6 rsa/ecdsa/ecdh/dhm and PSA key types and algorithms; PKCS#11 3.1 CKK_/CKM_ public-key names; GnuTLS GNUTLS_PK_/GNUTLS_SIGN_; Libgcrypt GCRY_PK_. Not covered: strongSwan's source API, X.509 text names in C, the rest of each library's API."

