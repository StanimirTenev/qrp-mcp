# Operation `sign`: a signing or verification call in code, or a signing step in a build or CLI
# tool (definicii.md). Ecosystem NET (stage 4, 24.11.2026, rows 363, 382, 383): System.Security.Cryptography
# SignData/SignHash/Verify*, the signature formatters, SignedXml, CertificateRequest, and the Windows
# signing tools (signtool, Set-AuthenticodeSignature, mage, nuget, sn, MSBuild strong naming), from
# learn.microsoft.com. `expect`: a row of the family on the call line (role signature for RSA), the
# weak hash where the call names one, or a signing step in evidence.ci_pipeline with its digest.
# Variants change the receiver (parameter, factory, certificate), the hash, the file kind.

operation = "sign"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "NET"
scope = "RSA SignData/SignHash/VerifyData/VerifyHash, ECDsa and DSA SignData/SignHash/CreateSignature/VerifyData/VerifyHash/VerifySignature, on a receiver from a parameter, a factory or a certificate getter, with the hash as a free part; RSAPKCS1SignatureFormatter/Deformatter; SignedXml RSA-SHA1 and DSA URIs; CertificateRequest with its hash; signtool sign /fd in .ps1/.cmd/.bat/.csproj (rows 382, 383); Set-AuthenticodeSignature -HashAlgorithm; mage -Sign; nuget sign and dotnet nuget sign; sn -R; MSBuild SignAssembly with AssemblyOriginatorKeyFile (row 363). Not covered: SignedCms/CmsSigner (the family is the certificate's, not written), signtool without /fd and Set-AuthenticodeSignature without -HashAlgorithm (the default is the tool version's), MLDsa/SlhDsa SignData, Azure Key Vault signing."

