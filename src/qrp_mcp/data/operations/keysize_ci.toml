# Operation `keysize_gpg` (a part of keysize, named apart so that it does not read as keysize/CI
# closed: openssl, ssh-keygen and the rest of CI key generation are not in this file), ecosystem CI
# (25.11.2026, row 557): the algorithm, size and curve a GnuPG key
# generation names in a script or a pipeline -- `--quick-generate-key` / `--quick-gen-key` and
# `--quick-add-key` with an algo string, `--default-new-key-algo`, and the parameter file of
# `--generate-key --batch`. Kept in a file of its own. Pages fetched 25.11.2026 (GnuPG manual).
# `expect`: a source_code row on the line with the family, and the size or curve the string names.

operation = "keysize_gpg"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "CI"
scope = "gpg/gpg2 --quick-generate-key, --quick-gen-key and --quick-add-key with an algo string (rsa, rsaNNNN, dsa, dsaNNNN, elg, ed25519, cv25519, ed448, cv448, nistp256/384/521, brainpoolP256r1/384r1/512r1, secp256k1); --default-new-key-algo and default-new-key-algo in gpg.conf; the --generate-key --batch parameter file (Key-Type / Subkey-Type by name or number, Key-Length / Subkey-Length, Key-Curve / Subkey-Curve) in a file that is gpg's (%commit, Name-Real, Name-Email, --generate-key). Not covered: default, future-default, - and pqc (what the gpg that runs chooses), an interactive --full-generate-key (no algorithm on its line), a parameter file of a type the scanner does not read, a command split over lines with a backslash."

[[ecosystems.spellings]]
id = "gpg-quick-generate-key-rsaNNNN"
spelling = "gpg --quick-generate-key USER-ID rsaNNNN"
source = "https://www.gnupg.org/documentation/manuals/gnupg/OpenPGP-Key-Management.html"
quote = "a string “rsa4096” requests that the key length is 4096 bits"
file = "keys.sh"
snippet = '''
#!/bin/sh
gpg --batch --quick-generate-key ops@bank.example rsa4096 sign never
'''
expect = {rows = [{at = "evidence.source_code", match = {path = "keys.sh", line = 2, algorithm = "RSA", key_size = 4096}}]}

[[ecosystems.spellings.variants]]
snippet = '''
#!/bin/sh
gpg --batch --quick-gen-key ops@bank.example rsa3072 encrypt never
'''
expect = {rows = [{at = "evidence.source_code", match = {path = "keys.sh", line = 2, algorithm = "RSA", key_size = 3072}}]}

[[ecosystems.spellings.variants]]
