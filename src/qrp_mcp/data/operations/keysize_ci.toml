[[ecosystems.spellings]]
id = "gpg-batch-key-type-length"
spelling = "Key-Type: DSA / Key-Length: 1024 / Subkey-Type: ELG-E (gpg --batch --generate-key)"
source = "https://www.gnupg.org/documentation/manuals/gnupg/Unattended-GPG-key-generation.html"
quote = "Key-Type: DSA Key-Length: 1024 Subkey-Type: ELG-E Subkey-Length: 1024"
file = "keys.sh"
snippet = '''
#!/bin/sh
cat >foo <<EOF
%echo Generating a basic OpenPGP key
Key-Type: DSA
Key-Length: 1024
Subkey-Type: ELG-E
Subkey-Length: 1024
Name-Real: Joe Tester
Expire-Date: 0
%commit
EOF
gpg --batch --generate-key foo
'''
expect = {rows = [{at = "evidence.source_code", match = {path = "keys.sh", line = 4, algorithm = "DSA", key_size = 1024}}, {at = "evidence.source_code", match = {path = "keys.sh", line = 6, algorithm = "ElGamal"}}]}

