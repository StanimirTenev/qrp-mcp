# Operation `sign`, ecosystem CI (24.11.2026): a signing step in a pipeline, a build or a release
# script -- cosign sign / sign-blob, gpg --sign / --detach-sign / --clear-sign, openssl dgst -sign and
# pkeyutl -sign, signtool sign, jarsigner, codesign, notation sign, minisign -S, ssh-keygen -Y sign,
# tpm2_sign, pkcs11-tool --sign, and the Sigstore signing actions of GitHub (sigstore/gh-action-
# sigstore-python, actions/attest and attest-build-provenance). Kept in a file of its own (sign/NET is
# written elsewhere). Pages fetched 24.11.2026. `expect`: a ci_pipeline row on the line with its
# command type, and the key it names where the line names one. Rows 191 (a), 367, 482, 510.

operation = "sign"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "CI"
scope = "GitHub Actions workflows (run: lines and uses: of the Sigstore signing actions) and shell scripts: cosign sign and sign-blob (--key file, KMS URI, keyless --yes), gpg -s/--sign, -b/--detach-sign, --clear-sign/--clearsign with -u/--local-user, short options clustered (-ab); openssl dgst -sign and openssl <digest> -sign, openssl pkeyutl -sign -inkey in either order; signtool sign /f, /a, /n with /fd; jarsigner; codesign -s/--sign; notation sign; minisign -S (-Sm); ssh-keygen -Y sign; tpm2_sign; pkcs11-tool --sign/-s; sigstore/gh-action-sigstore-python, actions/attest, actions/attest-build-provenance. Not covered: a command split over lines with a backslash (the line that names the command is the row; options on the next line are not read), GitLab/Azure/Jenkins syntax beyond the command line itself, rpmsign, debsigs, git tag -s / commit -S, SAML metadata signatures (row 191 (b): a file type, not a CI step)."

[[ecosystems.spellings]]
id = "cosign-sign-key"
spelling = 'cosign sign --key KEY IMAGE'
source = "https://raw.githubusercontent.com/sigstore/cosign/main/doc/cosign_sign.md"
quote = 'cosign sign --key cosign.key <IMAGE DIGEST>'
file = ".github/workflows/release.yml"
snippet = '''
name: release
on: push
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - run: cosign sign --key cosign.key ghcr.io/acme/app@sha256:4f1c
'''
expect = {rows = [{at = "evidence.ci_pipeline", match = {path = ".github/workflows/release.yml", line = 7, command_type = "cosign_sign"}}]}

