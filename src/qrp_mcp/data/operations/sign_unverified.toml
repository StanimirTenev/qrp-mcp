[[ecosystems.spellings]]
id = "jsonwebtoken-decode-then-verify"
spelling = "jwt.decode(token) with jwt.verify(token, ...) later in the same block"
source = "https://raw.githubusercontent.com/auth0/node-jsonwebtoken/master/README.md"
quote = "Returns the decoded payload without verifying if the signature is valid."
file = "v.ts"
snippet = '''
import jwt from 'jsonwebtoken'
function check (token) {
  const decoded = jwt.decode(token)
  jwt.verify(token, publicKey, (err) => { if (err === null) { use(decoded) } })
}
'''
expect = {rows = [{at = "evidence.source_code", match = {path = "v.ts", line = 3, algorithm = "JWT-unverified", verified_after = "v.ts:4"}}]}

