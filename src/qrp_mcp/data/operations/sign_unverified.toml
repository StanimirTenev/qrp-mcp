# Operation `sign_unverified` (a part of sign, named apart so that it does not read as sign closed in
# these ecosystems), 25.11.2026, row 594: a JOSE token accepted or made with no verified signature -- an
# Unsecured JWS (alg "none", RFC 7518 section 3.6) or a token read without verifying its signature -- in
# each library's documented spelling. Pages fetched 25.11.2026. `expect`: a source_code row of the family
# JWT-unverified on the line.

operation = "sign_unverified"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "Py"
scope = "PyJWT and python-jose: options verify_signature False, algorithms with none, encode with algorithm none, get_unverified_claims. Not covered: PyJWT 1.x verify=False, jwcrypto, Authlib."

[[ecosystems.spellings]]
id = "pyjwt-verify-signature-false"
spelling = "jwt.decode(token, options={\"verify_signature\": False})"
source = "https://pyjwt.readthedocs.io/en/stable/usage.html"
quote = "you can set the verify_signature option to False"
file = "a.py"
snippet = '''
import jwt
c = jwt.decode(token, options={"verify_signature": False})
'''
expect = {rows = [{at = "evidence.source_code", match = {path = "a.py", line = 2, algorithm = "JWT-unverified"}}]}

