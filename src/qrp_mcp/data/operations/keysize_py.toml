# Operation `keysize`, ecosystem Python (24.11.2026): the size, curve or parameter set given to a key
# when Python code makes one -- pyca/cryptography (rsa, dsa, dh, ec), PyCryptodome (RSA, DSA, ECC),
# paramiko (RSAKey, ECDSAKey), pyOpenSSL (PKey.generate_key), M2Crypto (RSA.gen_key, DSA.gen_params,
# EC.gen_params, DH.gen_params). Kept in a file of its own beside keysize.toml (NET, PKI) so the two
# can be edited apart. Pages fetched 24.11.2026. `expect`: the evidence row of the line with its
# algorithm, size and curve; a size held in a name of the file is read through the name, and a size
# the file does not fix stays `undetermined` (a rule must not invent one). Rows 179, 397, 435, 458.

operation = "keysize"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "Py"
scope = "pyca/cryptography rsa.generate_private_key (keyword, positional, over lines), dsa.generate_private_key and generate_parameters, dh.generate_parameters, ec.generate_private_key and derive_private_key with each curve class of the page (SECP192R1 ... SECP521R1, SECP256K1, the four Brainpool), imported bare or through the module; PyCryptodome RSA.generate, DSA.generate, ECC.generate(curve=) with the names of its ECC table for the NIST curves; paramiko RSAKey.generate, ECDSAKey.generate(bits=, curve=); pyOpenSSL PKey.generate_key(TYPE_RSA/TYPE_DSA, bits); M2Crypto RSA.gen_key, DSA.gen_params, EC.gen_params(EC.NID_*), DH.gen_params. The size as a literal, a keyword, or a name assigned a literal in the file. Not covered: a size computed or passed in from another module (undetermined, by design), key loading (keyfile), Ed25519/X25519 (no size to set), PyNaCl, python-ecdsa, the removed binary SECT curves."

