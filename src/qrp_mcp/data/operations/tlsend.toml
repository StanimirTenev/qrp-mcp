# Operation `tlsend`, ecosystem nginx (nginx and nginx-like servers: nginx, HAProxy, Caddy): where TLS
# terminates, whether the peer's certificate is verified, and which trust anchor verifies it. Pages
# fetched 18.11.2026. `expect` follows the page: a `*_ssl_verify` directive that is off -- or absent,
# where the page gives off as the default -- is a TLS hop that is not authenticated; a
# `*_trusted_certificate` or `ca-file` is a trust store.

operation = "tlsend"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "nginx"
scope = "nginx http/stream listen ssl, proxy/grpc/uwsgi ssl_verify and *_ssl_trusted_certificate, ssl_client_certificate, ssl_trusted_certificate; HAProxy bind ssl, verify none (server, default-server, ssl-server-verify), server ca-file; Caddy reverse_proxy tls_insecure_skip_verify. Not covered: ssl_verify_client optional_no_ca, the upstream direction of *_ssl_protocols (row 193), Envoy, Traefik, listen quic, grpc/uwsgi verification by default."

[[ecosystems.spellings]]
id = "nginx-http-listen-ssl"
spelling = "listen 443 ssl"
source = "https://nginx.org/en/docs/http/ngx_http_core_module.html"
quote = "The ssl parameter (0.7.14) allows specifying that all connections accepted on this port should work in SSL mode."
file = "nginx.conf"
snippet = '''
http {
  server {
    listen 443 ssl;
  }
}
'''
expect = {rows = [{at = "tls_listeners.places", match = {path = "nginx.conf", line = 2}}]}

[[ecosystems.spellings]]
id = "nginx-stream-listen-ssl"
spelling = "stream listen 12345 ssl"
source = "https://nginx.org/en/docs/stream/ngx_stream_ssl_module.html"
quote = "listen 12345 ssl;"
file = "nginx.conf"
snippet = '''
stream {
  server {
    listen 12345 ssl;
  }
}
'''
expect = {rows = [{at = "tls_listeners.places", match = {path = "nginx.conf", line = 2}}]}

[[ecosystems.spellings]]
id = "haproxy-bind-ssl-crt"
spelling = "bind :443 ssl crt"
source = "https://docs.haproxy.org/3.0/configuration.html"
quote = "ssl This setting is only available when support for OpenSSL was built in. It enables SSL deciphering on connections instantiated from this listener."
file = "haproxy.cfg"
snippet = '''
frontend f
  bind :443 ssl crt /etc/haproxy/site.pem
'''
expect = {rows = [{at = "evidence.protocols", match = {line = 2, basis = "configured_listener"}}]}

[[ecosystems.spellings]]
id = "nginx-proxy-ssl-verify-off"
spelling = "proxy_ssl_verify off"
source = "https://nginx.org/en/docs/http/ngx_http_proxy_module.html"
quote = "Enables or disables verification of the proxied HTTPS server certificate."
file = "nginx.conf"
snippet = '''
http {
  server {
    listen 443 ssl;
    location / {
      proxy_pass https://up;
      proxy_ssl_verify off;
    }
  }
}
'''
expect = {rows = [{at = "evidence.protocols", match = {line = 6, basis = "configured_verification", peer_verification = "off", verification_setting = "proxy_ssl_verify off"}}]}

[[ecosystems.spellings]]
id = "nginx-proxy-ssl-verify-default"
