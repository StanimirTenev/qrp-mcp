}
'''
expect = {rows = [{at = "evidence.protocols", match = {line = 5, basis = "configured_verification", peer_verification = "off"}}]}

[[ecosystems.spellings]]
id = "nginx-stream-proxy-ssl-verify-off"
spelling = "stream proxy_ssl_verify off"
