# Operation `tlsend`, ecosystem nginx (nginx and nginx-like servers: nginx, HAProxy, Caddy): where TLS
# terminates, whether the peer's certificate is verified, and which trust anchor verifies it. Pages
# fetched 18.11.2026. `expect` follows the page: a `*_ssl_verify` directive that is off -- or absent,
# where the page gives off as the default -- is a TLS hop that is not authenticated; a
# `*_trusted_certificate` or `ca-file` is a trust store; `ssl_verify_client` is the check of the client's
# certificate, reported as written (on, optional, and off for optional_no_ca and off).

operation = "tlsend"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "nginx"
scope = "nginx http/stream listen ssl, proxy/grpc/uwsgi ssl_verify and *_ssl_trusted_certificate, ssl_client_certificate, ssl_trusted_certificate, ssl_verify_client as written; HAProxy bind ssl, verify none (server, default-server, ssl-server-verify), server ca-file; Caddy reverse_proxy tls_insecure_skip_verify; every nginx directive above read as a statement wherever it starts on a line (a block or several directives on one line, row 558). Not covered: ssl_verify_client by default (off), HAProxy bind verify (the client side), the upstream direction of *_ssl_protocols (row 193), Envoy, Traefik, listen quic, grpc/uwsgi verification by default."

[[ecosystems.spellings]]
id = "nginx-http-listen-ssl"
spelling = "listen 443 ssl"
source = "https://nginx.org/en/docs/http/ngx_http_core_module.html"
quote = "The ssl parameter (0.7.14) allows specifying that all connections accepted on this port should work in SSL mode."
file = "nginx.conf"
snippet = '''
http {
  server {
    listen 443 ssl;
  }
}
'''
expect = {rows = [{at = "tls_listeners.places", match = {path = "nginx.conf", line = 2}}]}

