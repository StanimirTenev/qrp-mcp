[[ecosystems.refresh]]
source = "https://nginx.org/en/docs/http/ngx_http_proxy_module.html"
pattern = '\b(proxy_ssl_\w+)\b'
ignore = ["proxy_ssl_certificate", "proxy_ssl_certificate_cache", "proxy_ssl_certificate_key", "proxy_ssl_ciphers", "proxy_ssl_conf_command", "proxy_ssl_key_log", "proxy_ssl_name", "proxy_ssl_password_file", "proxy_ssl_server_name", "proxy_ssl_session_reuse", "proxy_ssl_verify_depth"]
file = "nginx.conf"
snippet = "http {\n  server {\n    listen 443 ssl;\n    {candidate} off;\n  }\n  server {\n    listen 443 ssl;\n    {candidate} /etc/nginx/ca.pem;\n  }\n}\n"
expect = {any = [{rows = [{at = "evidence.protocols", match = {path = "nginx.conf", line = 4}}]}, {rows = [{at = "trust_stores.places", match = {path = "nginx.conf", line = 4}}]}, {rows = [{at = "evidence.protocols", match = {path = "nginx.conf", line = 8}}]}, {rows = [{at = "trust_stores.places", match = {path = "nginx.conf", line = 8}}]}]}

