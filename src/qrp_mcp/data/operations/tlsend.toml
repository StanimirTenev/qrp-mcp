[[ecosystems.spellings]]
id = "caddy-tls-insecure-skip-verify"
spelling = "transport http { tls_insecure_skip_verify }"
source = "https://caddyserver.com/docs/caddyfile/directives/reverse_proxy"
quote = "tls_insecure_skip_verify turns off TLS handshake verification, making the connection insecure"
file = "Caddyfile"
snippet = '''
example.com {
  reverse_proxy https://up {
