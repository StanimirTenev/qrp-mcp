# Operation `symhash`: a symmetric cipher, hash, MAC or KDF in use (definicii.md). Ecosystem NET
# (stage 4, 24.11.2026, rows 379, 380, 381): the weak hashes and ciphers of System.Security.Cryptography,
# AES in ECB mode, the SHA-1 defaults of the KDFs, and the hash of a certificate made by
# New-SelfSignedCertificate or certreq, from learn.microsoft.com. `expect`: the family on its line.
# Variants change the receiver and variable names, the file kind, line continuation.

operation = "symhash"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "NET"
scope = "MD5/SHA1 Create, HashData(Async), the CryptoServiceProvider/Managed classes, HMACMD5/HMACSHA1, IncrementalHash.CreateHash/CreateHMAC with HashAlgorithmName.MD5/SHA1; DES/TripleDES/RC2 Create; AES in ECB mode by CipherMode.ECB or EncryptEcb/DecryptEcb on any receiver (row 381); Rfc2898DeriveBytes without a hash (SHA-1, row 380) and with SHA1, Pbkdf2; PasswordDeriveBytes; HKDF with SHA1/MD5; New-SelfSignedCertificate -HashAlgorithm on one line, with backtick continuation and splatted, certreq .inf HashAlgorithm (row 379). Not covered: RSAEncryptionPadding.OaepSHA1 (SHA-1 in OAEP is not a weakness of the hash), System.Random (rng_source), SHA-2/SHA-3 (no finding), ProtectedData."

[[ecosystems.spellings]]
