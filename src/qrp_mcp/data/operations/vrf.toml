[[ecosystems.spellings]]
id = "keytransparency-p256-evaluate"
spelling = "k.Evaluate(m)"
source = "https://raw.githubusercontent.com/google/keytransparency/master/core/crypto/vrf/p256/p256.go"
quote = "// Evaluate returns the verifiable unpredictable function evaluated at m"
file = "index.go"
snippet = '''
package index

import "github.com/google/keytransparency/core/crypto/vrf/p256"

func Index(user []byte) ([32]byte, []byte) {
	k, _ := p256.GenerateKey()
	return k.Evaluate(user)
}
'''
