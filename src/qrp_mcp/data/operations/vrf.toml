# Operation `vrf`: a verifiable random function over an elliptic curve (ECVRF, RFC 9381) -- leader
# election, sortition, key transparency indexes. Its own role, not a signature (ZA-OPRAVYANE row 535,
# 19.11.2026). Pages fetched 19.11.2026. `expect`: an ECVRF row on the line, and the `vrf` part of
# summary.by_role. A call is read only in a file that imports the library; `vrf` alone is also virtual
# routing and forwarding.

operation = "vrf"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "Go"
scope = "github.com/yahoo/coname/vrf (GenerateKey, Prove, Verify, Compute), github.com/ProtonMail/go-ecvrf/ecvrf (GenerateKey, NewPrivateKey, NewPublicKey, and Prove/Verify on its keys), github.com/google/keytransparency/core/crypto/vrf/p256 (GenerateKey, Evaluate, ProofToHash), and the four RFC 9381 suite names as strings. A method call on a package (`ed25519.Verify(...)`) is not the VRF's. Not covered: other Go VRF packages, a call through a variable the package is not imported under."

[[ecosystems.spellings]]
id = "coname-prove"
spelling = "vrf.Prove(m, sk)"
source = "https://raw.githubusercontent.com/yahoo/coname/master/vrf/vrf.go"
quote = "// Prove returns the vrf value and a proof such that Verify(pk, m, vrf, proof)"
file = "elect.go"
snippet = '''
package elect

import vrf "github.com/yahoo/coname/vrf"

func Elect(seed []byte, sk *[vrf.SecretKeySize]byte) ([]byte, []byte) {
	return vrf.Prove(seed, sk)
}
'''
expect = {rows = [{at = "evidence.source_code", match = {line = 6, algorithm = "ECVRF", evidence_kind = "call"}}], value = [{at = "summary.by_role.vrf.pqc_readiness", is = "classical_only"}]}

[[ecosystems.spellings]]
id = "coname-verify"
spelling = "vrf.Verify(pk, m, vrf, proof)"
source = "https://raw.githubusercontent.com/yahoo/coname/master/vrf/vrf.go"
quote = "// Verify returns true iff vrf=Compute(m, sk) for the sk that corresponds to pk."
file = "check.go"
snippet = '''
package check

import "github.com/yahoo/coname/vrf"

func Check(pk, m, out, proof []byte) bool {
	return vrf.Verify(pk, m, out, proof)
}
'''
expect = {rows = [{at = "evidence.source_code", match = {line = 6, algorithm = "ECVRF", evidence_kind = "call"}}]}

