[[ecosystems]]
ecosystem = "Go"
scope = "CometBFT crypto/ed25519: Sign and VerifySignature on a key from GenPrivKey."

[[ecosystems.spellings]]
id = "cometbft-ed25519-sign"
spelling = "Sign(msg []byte)"
source = "https://pkg.go.dev/github.com/cometbft/cometbft/crypto/ed25519"
quote = "func (privKey PrivKey) Sign(msg []byte) ([]byte, error)"
file = "comet.go"
snippet = '''
package main

import "github.com/cometbft/cometbft/crypto/ed25519"

func run(msg []byte) {
	pv := ed25519.GenPrivKey()
	sig, _ := pv.Sign(msg)
}
'''
expect = {rows = [{at = "evidence.source_code", match = {line = 7, algorithm = "Ed25519", evidence_kind = "call"}}]}

