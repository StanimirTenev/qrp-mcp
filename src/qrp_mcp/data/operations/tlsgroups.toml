# Operation `tlsgroups`, ecosystem nginx (nginx and nginx-like servers: nginx, HAProxy, Caddy): the
# key-exchange groups a TLS terminator is configured to offer. Every named group of the IANA TLS
# Supported Groups registry once, in ssl_ecdh_curve; every directive or keyword that sets the list
# once; the list syntax of OpenSSL 3.5 (SSL_CTX_set1_groups_list(3)). Pages fetched 18.11.2026.
# `expect`: a classical group offered alone is a tls_groups row (family, offered alone, the
# setting); a hybrid is an ML-KEM row with its parameter set and a row for its classical half, and
# no tls_groups row, since its half is not offered alone; ML-KEM alone is no ECDH and no X25519.

operation = "tlsgroups"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "nginx"
scope = "nginx http/stream ssl_ecdh_curve, ssl_conf_command Groups/Curves, proxy/grpc/uwsgi and stream proxy_ssl_conf_command Groups; HAProxy ssl-default-bind-curves, ssl-default-server-curves, bind and server curves; Caddy tls curves; group names from the IANA registry (bign-curve256v1, bign-curve384v1, bign-curve512v1 left out: the classifier has no family for STB 34.101.45); OpenSSL 3.5 list syntax (NIST and OID names, case, / tuples, * and ? prefixes, - removal). Not covered: DEFAULT and the library's default list (row 41: what the pinned library supports), groups unsupported by the pinned OpenSSL, ssl_ecdh_curve in an included file, HAProxy ssl-default-*-sigalgs, Envoy, Traefik."

[[ecosystems.spellings]]
id = "iana-sect163k1"
spelling = "ssl_ecdh_curve sect163k1;"
source = "https://www.iana.org/assignments/tls-parameters/tls-parameters-8.csv"
quote = "1,sect163k1,"
file = "nginx.conf"
snippet = '''
http {
  server {
    listen 443 ssl;
    ssl_ecdh_curve sect163k1;
  }
}
'''
expect = {rows = [{at = "evidence.tls_groups", match = {path = "nginx.conf", line = 4, group = "sect163k1", family = "ECDH", offered = "alone", setting = "ssl_ecdh_curve"}}]}

