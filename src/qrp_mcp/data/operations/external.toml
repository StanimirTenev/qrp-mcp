# Operation `external`, ecosystem Go (24.11.2026): the algorithm or implementation chosen outside the
# line -- read from the environment at run time (package os), required from a module (go.mod, go.sum,
# vendor/modules.txt; a replace swaps the module's code), or a GODEBUG / GOFIPS140 setting that switches
# the standard library's cryptography (go.mod and go.work godebug lines, //go:debug, the environment of
# the program or the build). `expect`: an environment read is a place in chosen_outside_files; a module
# is a dependency row with its version; a crypto GODEBUG or GOFIPS140 setting is a place with the
# setting's name and value. Row 546 (Go part): `os.Getenv("KEM_SCHEME")`.
[[ecosystems]]
ecosystem = "Go"
scope = "os.Getenv, os.LookupEnv, os.ExpandEnv (the name as a string, a raw string or a constant of the file), os.Environ() compared to a setting's name; go.mod require (one line and block, // indirect), replace of a required module, exclude (not a requirement); go.sum; vendor/modules.txt; godebug in go.mod and go.work (one line and block) and //go:debug, for the settings whose names concern cryptography (tls*, x509*, rsa*, crypto*, fips140*, mlkem, kyber, dsa); GODEBUG and GOFIPS140 assigned in a shell line or a Dockerfile ENV. Not covered: the go line's default GODEBUG (every go.mod has one), GOEXPERIMENT and build tags (go.dev/doc/security/fips140 names Go+BoringCrypto as the previous, unsupported mechanism but not its switch; go help environment lists GOEXPERIMENT with no crypto value), syscall.Getenv, os.Setenv(\"GODEBUG\"), environment set by a Kubernetes manifest (name/value on two lines)."

