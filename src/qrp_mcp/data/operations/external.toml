# Operation `external`, ecosystem Python: the algorithm or implementation chosen outside the line -- read
# from the environment at run time (the os module), or brought in by a declared dependency (pyproject.toml,
# dependency groups, requirements files, setuptools). Pages fetched 18.11.2026. `expect`: an environment read
# is a place in chosen_outside_files (with its default where one is written); a declared package is a
# dependency row carrying what the manifest asks for, and the version where it pins one (==).

operation = "external"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "Py"
scope = "os.environ[...] / .get, os.getenv, os.getenvb, os.environb; pyproject [project] dependencies and optional-dependencies, [dependency-groups]; requirements files (pins, ranges, markers, --hash); setup.cfg install_requires/extras_require; setup.py install_requires/extras_require. rfc3161ng RemoteTimestamper (row 536). Not covered: Pipfile, Poetry, uv/pdm lockfiles, conda, provider/version selection inside libraries (pyOpenSSL defaults, row 164)."

