[[ecosystems.spellings]]
id = "pyproject-dependencies"
spelling = "[project] dependencies"
source = "https://packaging.python.org/en/latest/specifications/pyproject-toml/"
quote = "dependencies ¶ TOML type: Array of dependency specifier strings"
file = "pyproject.toml"
snippet = '''
[project]
name = "a"
dependencies = ["cryptography>=42.0"]
[project.optional-dependencies]
ssh = ["paramiko==3.4.0"]
'''
expect = {rows = [{at = "evidence.dependencies", match = {path = "pyproject.toml", line = 3, package = "cryptography", requested = ">=42.0"}}]}

