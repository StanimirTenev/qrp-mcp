[[ecosystems.spellings]]
id = "os-environ-compare"
spelling = "for _, kv := range os.Environ() { ... \"NAME=\" ... }"
source = "https://pkg.go.dev/os"
quote = "Environ returns a copy of strings representing the environment, in the form \"key=value\"."
file = "kem.go"
snippet = '''
package kem

import (
    "os"
    "strings"
)

func Scheme() string {
    for _, kv := range os.Environ() {
        if strings.HasPrefix(kv, "KEM_SCHEME=") {
            return strings.TrimPrefix(kv, "KEM_SCHEME=")
        }
    }
    return ""
}
'''
expect = {rows = [{at = "chosen_outside_files.places", match = {path = "kem.go", line = 10}}]}

[[ecosystems.spellings.variants]]
snippet = '''
package kem

import (
    "os"
    "strings"
)

func Scheme() string {
    for _, kv := range os.Environ() {
        k, v, _ := strings.Cut(kv, "=")
        if k == "SIGN_ALG" {
            return v
        }
    }
    return ""
}
'''
expect = {rows = [{at = "chosen_outside_files.places", match = {path = "kem.go", line = 11}}]}

