# Operation `rng_source`: the random number generator a line calls, in one of three classes -- `weak`, a
# non-cryptographic PRNG by its own documentation; `csprng`, a named cryptographic generator; `check`, a
# call the documentation does not settle by itself (ZA-OPRAVYANE rows 531, 539; design in
# rng-prouchvane/02-dizajn.md, 19.11.2026). Pages fetched 19.11.2026. `expect`: a row in `randomness.calls`
# on the line, with its class and the catalogue's name for the API. A row is context: it gives no finding,
# no classification and no verdict, and it moves neither the findings nor their fingerprint.

operation = "rng_source"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "Py"
scope = "the random module (its functions and random.Random; random.SystemRandom is csprng), numpy.random, secrets, os.urandom and os.getrandom, each resolved through the file's own imports (import as, from ... import). Not covered: random.Random subclasses, a generator object passed in, docstrings, third-party packages (pycryptodome Random, PyNaCl)."

[[ecosystems.spellings]]
id = "random-getrandbits"
spelling = "random.getrandbits(256)"
source = "https://docs.python.org/3/library/random.html"
quote = "The pseudo-random generators of this module should not be used for security purposes. For security or cryptographic uses, see the secrets module."
file = "keys.py"
snippet = '''
import random

seed = random.getrandbits(256)
'''
