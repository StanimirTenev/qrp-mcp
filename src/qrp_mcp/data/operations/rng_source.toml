[[ecosystems]]
ecosystem = "NET"
scope = "System.Random (new, with or without System., in C# and VB; Random.Shared), System.Security.Cryptography.RandomNumberGenerator (Create and the static GetBytes, Fill, GetInt32, GetHexString, GetString, GetItems, Shuffle), RNGCryptoServiceProvider. Not covered: F# Random() without new, a Random subclass, Unity's UnityEngine.Random."

[[ecosystems.spellings]]
id = "dotnet-new-random"
spelling = "new Random()"
source = "https://learn.microsoft.com/en-us/dotnet/fundamentals/runtime-libraries/system-random"
quote = "The Random class represents a pseudo-random number generator"
file = "Gen.cs"
snippet = '''
using System;

class Gen { int F() { var r = new Random(); return r.Next(); } }
'''
expect = {rows = [{at = "randomness.calls", match = {line = 3, class = "weak", api = "System.Random"}}]}

[[ecosystems.spellings]]
id = "dotnet-random-shared"
spelling = "Random.Shared.Next()"
source = "https://learn.microsoft.com/en-us/dotnet/fundamentals/runtime-libraries/system-random"
quote = "Provides a thread-safe Random instance that may be used concurrently from any thread."
file = "Gen.cs"
snippet = '''
using System;

class Gen { int F() => Random.Shared.Next(); }
'''
expect = {rows = [{at = "randomness.calls", match = {line = 3, class = "weak", api = "System.Random.Shared"}}]}

[[ecosystems.spellings]]
id = "dotnet-rng-getbytes"
spelling = "RandomNumberGenerator.GetBytes(32)"
source = "https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.randomnumbergenerator"
quote = "Cryptographic random number generators create cryptographically strong random values."
file = "Key.cs"
snippet = '''
using System.Security.Cryptography;

class Key { byte[] F() => RandomNumberGenerator.GetBytes(32); }
'''
expect = {rows = [{at = "randomness.calls", match = {line = 3, class = "csprng", api = "System.Security.Cryptography.RandomNumberGenerator"}}]}

[[ecosystems.spellings]]
id = "dotnet-rngcsp"
spelling = "new RNGCryptoServiceProvider()"
source = "https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.randomnumbergenerator"
quote = "This is preferred over calling the constructor of the derived class RNGCryptoServiceProvider, which is not available on all platforms."
file = "Key.cs"
snippet = '''
using System.Security.Cryptography;

class Key { void F(byte[] b) { using var r = new RNGCryptoServiceProvider(); r.GetBytes(b); } }
'''
expect = {rows = [{at = "randomness.calls", match = {line = 3, class = "csprng", api = "System.Security.Cryptography.RNGCryptoServiceProvider"}}]}

[[ecosystems]]
ecosystem = "PHP"
scope = "rand(), mt_rand(), srand(), mt_srand() as functions (not methods, not a declaration), random_int(), random_bytes(). In .php files. Not covered: Random\\Randomizer and its engines, lcg_value(), uniqid(), openssl_random_pseudo_bytes(), Ruby (its files share this ecosystem's label in `ecosystems`)."

[[ecosystems.spellings]]
id = "php-rand"
spelling = "rand()"
source = "https://www.php.net/manual/en/function.rand.php"
quote = "This function does not generate cryptographically secure values, and must not be used for cryptographic purposes, or purposes that require returned values to be unguessable."
file = "tok.php"
snippet = '''
<?php
$token = rand(100000, 999999);
'''
expect = {rows = [{at = "randomness.calls", match = {line = 2, class = "weak", api = "rand"}}]}

[[ecosystems.spellings]]
id = "php-mt-rand"
spelling = "mt_rand()"
source = "https://www.php.net/manual/en/function.mt-rand.php"
quote = "This function does not generate cryptographically secure values, and must not be used for cryptographic purposes, or purposes that require returned values to be unguessable."
file = "tok.php"
snippet = '''
<?php
mt_srand(42);
$nonce = mt_rand();
'''
expect = {rows = [{at = "randomness.calls", match = {line = 3, class = "weak", api = "mt_rand"}}, {at = "randomness.calls", match = {line = 2, class = "weak", api = "mt_srand", seed = "literal"}}]}

[[ecosystems.spellings]]
id = "php-random-int"
spelling = "random_int(0, 99)"
source = "https://www.php.net/manual/en/function.random-int.php"
quote = "random_int — Get a cryptographically secure, uniformly selected integer"
file = "tok.php"
snippet = '''
<?php
$n = random_int(0, 99);
'''
expect = {rows = [{at = "randomness.calls", match = {line = 2, class = "csprng", api = "random_int"}}]}

[[ecosystems.spellings]]
