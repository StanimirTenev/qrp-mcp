# Operation `pqc`, ecosystem C: a post-quantum algorithm named in C through its library's API.
# liboqs: every algorithm identifier of kem.h, sig.h and sig_stfl.h, both the macro and the
# string it stands for, in OQS_*_new, and the operations on an object (keypair, encaps,
# decaps, sign, verify), from the project's published Doxygen reference; wolfSSL's LMS and XMSS
# API (wolfSSL manual); Cisco hash-sigs (its read.me). Pages fetched 18.11.2026.
# `expect`: a row with the family the classifier gives that scheme, the provider for liboqs, the
# parameter set where the scan reports one (ML-KEM, ML-DSA, SLH-DSA, sntrup), and the operation.

operation = "pqc"
catalogue_version = "1"

[[ecosystems]]
ecosystem = "C"
scope = "liboqs kem.h/sig.h/sig_stfl.h (Doxygen: the published API reference, generated from the headers, counts as documentation; a header read as source would not); wolfSSL wc_LmsKey_*, wc_XmssKey_*, WC_LMS_PARM_*, XMSS parameter strings; hash-sigs hss_* of read.me. Not covered: liboqs per-scheme functions (OQS_KEM_ml_kem_768_keypair: in per-scheme headers, not in the reference), the NIST/PQClean crypto_kem_* API (no documentation page fetched: NIST's api-notes is a PDF not read here), parameter sets of families the scan gives none (HQC, BIKE, FrodoKEM, Classic McEliece, Falcon, MAYO, CROSS, UOV, SNOVA, MQOM, LMS, XMSS), wolfSSL ML-KEM/ML-DSA (apiname), Bouncy Castle (row 50: Java)."

